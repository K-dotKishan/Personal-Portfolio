<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Kishan | Contact</title>
    <link rel="stylesheet" href="style.css" />
</head>
<body>

<!-- Theme Toggle Button -->
<button class="theme-toggle" id="themeToggle" aria-label="Toggle theme">
    <svg id="sunIcon" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke="currentColor">
        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
            d="M12 3v1m0 16v1m9-9h-1M4 12H3m15.364 6.364l-.707-.707M6.343 6.343l-.707-.707m12.728 0l-.707.707M6.343 17.657l-.707.707M16 12a4 4 0 11-8 0 4 4 0z" />
    </svg>
    <svg id="moonIcon" style="display:none" xmlns="http://www.w3.org/2000/svg" fill="none"
        viewBox="0 0 24 24" stroke="currentColor">
        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
            d="M20.354 15.354A9 9 0 018.646 3.646 9.003 9.003 0 0012 21a9.003 9.003 0 008.354-5.646z" />
    </svg>
</button>

<!-- Navbar -->
<div id="navbar"></div>

<!-- Contact Section -->
<section class="contact">
    <h2>Contact Me</h2>
    <p>If you have any questions or want to work together, feel free to message me.</p>

    <!-- ✅ ONLY CHANGE IS HERE -->
    <form 
        class="contact-form"
      
       
    >

        <input
            type="text"
            name="name"
            placeholder="Your Name"
            required
        />

        <input
            type="email"
            name="email"
            placeholder="Your Email"
            required
        />

        <textarea
            name="message"
            placeholder="Your Message"
            rows="5"
            required
        ></textarea>

        <button type="submit">Send Message</button>
    </form>
</section>

<!-- Footer -->
<footer class="footer">
    <div class="footer-content">
        <div class="footer-social">
            <a href="https://github.com/K-dotKishan" target="_blank" class="social-link">
                <span>GitHub</span>
            </a>
            <a href="https://www.linkedin.com/in/kishan-singh-872a532a3/" target="_blank" class="social-link">
                <span>LinkedIn</span>
            </a>
        </div>
        <p class="footer-text">
            © <span id="year"></span> Kishan Singh. Crafted with passion and code.
        </p>
    </div>
</footer>

<script src="script.js"></script>
</body>
</html>
